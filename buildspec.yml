
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - cd frontend
      - npm install

  build:
    commands:
      - npm run build

  post_build:
    commands:
      - aws s3 sync dist/ s3://eternalln-apartment-portal-frontend-2026/ --delete
      - aws cloudfront create-invalidation --distribution-id EKLWXDDGY134U --paths "/*"

artifacts:
  base-directory: frontend/dist
  files:
    - '**/*'
