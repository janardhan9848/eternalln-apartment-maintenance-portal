version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Installing frontend dependencies..."
      - cd frontend
      - npm install

  build:
    commands:
      - echo "Building EternalLN Apartment Portal..."
      - npm run build
      - echo "Frontend build completed successfully."

artifacts:
  base-directory: frontend/dist
  files:
    - '**/*'