
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - cd frontend && npm install

  build:
    commands:
      - cd frontend && npm run build

  post_build:
    commands:
      - cd "$CODEBUILD_SRC_DIR"
      - aws s3 sync frontend/dist/ s3://eternalln-apartment-portal-frontend-2026/ --delete
      - aws cloudfront create-invalidation --distribution-id EKLWXDDGY134U --paths "/*"
      - |
        INSTANCE_ID="i-021ab855d8470b861"
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --parameters '{"commands":["sudo -u ubuntu -H bash -lc \"cd /home/ubuntu/eternalln-apartment-maintenance-portal && git pull origin main && cd backend && npm install --omit=dev && pm2 restart apartment-backend\""]}' \
          --query "Command.CommandId" \
          --output text)
        echo "SSM Command ID: $COMMAND_ID"
        aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
        aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"

artifacts:
  base-directory: frontend/dist
  files:
    - '**/*'
